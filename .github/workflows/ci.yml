name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest -m 'not slow and not live and not browser'

  browser:
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser -rs

  live:
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # The built-in token reads public data only, which is all the live tests use.
      # It is also available (read-only) on pull requests from forks.
      - run: uv run pytest -m live -rs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  audit:
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      # The agents repository is public, so the submodule clones over HTTPS
      # with no key.
      - name: Fill the .agents submodule
        run: git submodule update --init .agents
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: bin/audit-check.sh
