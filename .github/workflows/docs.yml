name: docs

on:
  pull_request:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group docs
      - run: uv run mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    # Only this job can write to the repository, to push the gh-pages branch.
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group docs
      - name: Build and deploy to gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run mkdocs gh-deploy --strict --force --no-history --remote-branch gh-pages
